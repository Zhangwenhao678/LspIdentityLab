name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Verify module structure
        run: python3 tools/verify_structure.py
      - name: Build APKs
        run: gradle :DemoTarget:assembleDebug :DemoLsp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LspIdentityLab-apks
          path: '**/build/outputs/apk/**/*.apk'
